name: Firmware build

on:
  push:
    branches:
      - feat/wiim-phase2-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build release firmware
        run: pio run -e esp32dev

      - name: Compile all on-target test suites
        run: pio test -e esp32dev --without-uploading --without-testing
