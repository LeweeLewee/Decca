name: Finalise C14 Rev B documentation

on:
  push:
    branches:
      - feat/iec-c14-mounting-plate
    paths:
      - .github/workflows/c14-revb-build.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/iec-c14-mounting-plate
          fetch-depth: 0

      - name: Update Rev B indexes and status
        run: python .github/c14_revb_finalize.py

      - name: Commit documentation and remove one-time helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/c14-revb-build.yml .github/c14_revb_finalize.py
          git add mechanical/CAD/README.md \
                  mechanical/STL/README.md \
                  mechanical/Drawings/README.md \
                  mechanical/Drawings/Decca_IEC_C14_Mounting_Plate_Spec_revA.md \
                  mechanical/Drawings/Decca_IEC_C14_Mounting_Plate_revB_Build_Report.md \
                  'docs/Revision History.md'
          git commit -m 'docs(c14-mount): make rev B active prototype'
          git push origin HEAD:feat/iec-c14-mounting-plate
