; ─────────────────────────────────────────────────────────────────────────────
; decca — PlatformIO project configuration
;
; ESP32 firmware for a restored 1960s Decca music centre.
; See docs/Firmware Architecture.md for the module layout this build targets.
;
; Common commands:
;   pio run                     build
;   pio run --target upload     build + flash
;   pio device monitor          serial monitor
;   pio test                    run unit tests
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
; Default environment(s) built when no --environment is given.
default_envs = esp32dev
src_dir = src

; ─────────────────────────────────────────────────────────────────────────────
; Shared settings inherited by every environment below.
; ─────────────────────────────────────────────────────────────────────────────
[env]
platform = espressif32
framework = arduino

; Toolchain / language
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

; Serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Unit testing (Unity, PlatformIO's default framework).
; test_build_src builds the modules in src/ alongside the test runner so tests
; can exercise the real module interfaces. main.cpp is guarded with
; PIO_UNIT_TESTING so its setup()/loop() don't collide with each test's runner.
test_build_src = yes

; Dependencies are pinned once introduced. Examples (commented until needed):
; lib_deps =
;     adafruit/Adafruit SSD1306 @ ^2.5.0     ; OLED display
;     adafruit/Adafruit GFX Library @ ^1.11.0
;     bblanchon/ArduinoJson @ ^7.0.0          ; WiiM HTTP API (Phase 2)

; ─────────────────────────────────────────────────────────────────────────────
; Primary target: generic ESP32 DevKit (dual-core, 4 MB flash).
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L
upload_speed = 921600

; ─────────────────────────────────────────────────────────────────────────────
; Debug environment: same board, symbols on, optimisation off.
; Build with:  pio run -e esp32dev-debug
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env.build_flags}
    -DDECCA_DEBUG=1
    -Og
    -g3
