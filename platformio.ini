; ─────────────────────────────────────────────────────────────────────────────
; decca — PlatformIO project configuration
;
; ESP32 firmware for a restored 1960s Decca music centre.
; See docs/Firmware Architecture.md for the module layout this build targets.
;
; Common commands:
;   pio run                     build
;   pio run --target upload     build + flash
;   pio device monitor          serial monitor
;   pio test                    run unit tests
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
; Default environment(s) built when no --environment is given.
default_envs = esp32dev
src_dir = src

; ─────────────────────────────────────────────────────────────────────────────
; Shared settings inherited by every environment below.
; ─────────────────────────────────────────────────────────────────────────────
[env]
platform = espressif32
framework = arduino

; Toolchain / language
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

; Serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Unit testing (Unity, PlatformIO's default framework).
; test_build_src builds the modules in src/ alongside the test runner so tests
; can exercise the real module interfaces. main.cpp is guarded with
; PIO_UNIT_TESTING so its setup()/loop() don't collide with each test's runner.
test_build_src = yes

; Dependencies are pinned for reproducible builds.
lib_deps =
    adafruit/Adafruit SH110X @ 2.1.14
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BusIO @ 1.17.4
    bblanchon/ArduinoJson @ 6.21.5

; ─────────────────────────────────────────────────────────────────────────────
; Primary target: generic ESP32 DevKit (dual-core, 4 MB flash).
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.partitions = default.csv
upload_speed = 921600

; ─────────────────────────────────────────────────────────────────────────────
; Debug environment: same board, symbols on, optimisation off.
; Build with:  pio run -e esp32dev-debug
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env.build_flags}
    -DDECCA_DEBUG=1
    -Og
    -g3

; Authenticated OTA target. Set DECCA_OTA_PASSWORD locally.
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = decca-esp32.local
upload_flags =
    --auth=${sysenv.DECCA_OTA_PASSWORD}

; Isolated health trial: no upload target is permitted in these environments.
[env:esp32dev-health]
extends = env:esp32dev
platform = espressif32@7.0.1
build_flags =
    ${env.build_flags}
    -DDECCA_HEALTH_ENABLED=1
extra_scripts = pre:tools/block_trial_upload.py

; Full network-path comparison using fake, non-deployable credentials.
[env:esp32dev-network-baseline]
extends = env:esp32dev
platform = espressif32@7.0.1
build_flags =
    ${env.build_flags}
    -include test/fixtures/health_build_config.h
extra_scripts = pre:tools/block_trial_upload.py

[env:esp32dev-health-compile]
extends = env:esp32dev-health
build_flags =
    ${env:esp32dev-health.build_flags}
    -include test/fixtures/health_build_config.h
